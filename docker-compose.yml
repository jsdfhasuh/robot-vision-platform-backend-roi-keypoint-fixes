services:
  backend:
    build: ./backend
    container_name: robot-vision-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./data/db/app.db
      - STORAGE_DIR=./data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-./data/logs}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-14}
      - MODEL_DIR=${MODEL_DIR:-./models}
      - ALERT_ENABLED=${ALERT_ENABLED:-false}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - NOTIFY_RECOVERY=${NOTIFY_RECOVERY:-true}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: robot-vision-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: robot-vision-mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
